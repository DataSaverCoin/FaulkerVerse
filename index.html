<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FaulkerVerse</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/developer-hud.css"
    >

    <!-- BabylonJS Core -->
    <script defer src="https://cdn.babylonjs.com/babylon.js"></script>
    <script defer src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <!-- BabylonJS Materials -->
    <script defer src="https://cdn.babylonjs.com/materialsLibrary/babylon.gridMaterial.min.js"></script>

</head>

<body>

    <canvas id="gameCanvas"></canvas>
    <div id="gameLoading">
        <div class="loadingCard">
            <h1>FAULKERVERSE</h1>
            <p id="loadingStage" role="status" aria-live="polite">Downloading game engine…</p>
            <progress id="loadingProgress" max="100" value="0" aria-label="Game loading progress"></progress>
            <p id="loadingPercent">0%</p>
            <small>Progress follows loading stages. Preparing the city may take a minute.</small>
        </div>
    </div>

    <script
        type="module"
        src="main.js"
    ></script>

</body>

</html>
